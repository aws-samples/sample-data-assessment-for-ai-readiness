AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DAFM Assessment Role — least-privilege, zero-parameter same-account deployment.
  Grants only the specific read-only actions used by the DAFM assessment pipeline.

Resources:
  DafmAssessmentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DAFM-Assessment-Role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
            Condition:
              StringLike:
                "aws:RequestTag/dafm-skill": "*"
      Policies:
        - PolicyName: DafmReadOnlyAssessment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ─────────────────────────────────────────────────────────────
              # P1: Agent Access & Discovery
              # ─────────────────────────────────────────────────────────────
              - Sid: P1GlueCatalogRead
                Effect: Allow
                Action:
                  - "glue:GetDatabases"
                  - "glue:GetTables"
                  - "glue:GetCrawlers"
                Resource: "*"

              - Sid: P1LakeFormationRead
                Effect: Allow
                Action:
                  - "lakeformation:ListResources"
                  - "lakeformation:GetDataLakeSettings"
                  - "lakeformation:ListPermissions"
                  - "lakeformation:ListLFTags"
                Resource: "*"

              - Sid: P1LambdaListFunctions
                Effect: Allow
                Action:
                  - "lambda:ListFunctions"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # P2: Semantic Context & Retrieval
              # ─────────────────────────────────────────────────────────────
              - Sid: P2S3ListBuckets
                Effect: Allow
                Action:
                  - "s3:ListAllMyBuckets"
                Resource: "*"

              - Sid: P2BedrockRead
                Effect: Allow
                Action:
                  - "bedrock:ListFoundationModels"
                  - "bedrock:ListKnowledgeBases"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # P3: Data Lineage & Provenance
              # ─────────────────────────────────────────────────────────────
              # Neptune management calls are authorized under rds: (see P4RDSMetadata).
              - Sid: P3GlueJobsRead
                Effect: Allow
                Action:
                  - "glue:ListJobs"
                Resource: "*"

              - Sid: P3SageMakerLineageRead
                Effect: Allow
                Action:
                  - "sagemaker:ListLineageGroups"
                Resource: "*"

              - Sid: P3OpenSearchRead
                Effect: Allow
                Action:
                  - "es:ListDomainNames"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # P4: Data Quality & Classification
              # ─────────────────────────────────────────────────────────────
              - Sid: P4MacieRead
                Effect: Allow
                Action:
                  - "macie2:GetMacieSession"
                Resource: "*"

              - Sid: P4GlueDataQualityRead
                Effect: Allow
                Action:
                  - "glue:ListDataQualityRulesets"
                  - "glue:ListRegistries"
                Resource: "*"

              - Sid: P4SageMakerMonitoringRead
                Effect: Allow
                Action:
                  - "sagemaker:ListMonitoringSchedules"
                Resource: "*"

              - Sid: P4DynamoDBMetadata
                Effect: Allow
                Action:
                  - "dynamodb:ListTables"
                Resource: "*"

              - Sid: P4RDSMetadata
                Effect: Allow
                Action:
                  - "rds:DescribeDBInstances"
                  - "rds:DescribeDBClusters"
                Resource: "*"

              - Sid: P4RedshiftMetadata
                Effect: Allow
                Action:
                  - "redshift:DescribeClusters"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # P5: Access Control, Identity & Tenancy
              # ─────────────────────────────────────────────────────────────
              - Sid: P5IAMRead
                Effect: Allow
                Action:
                  - "iam:ListRoles"
                Resource: "*"

              - Sid: P5CognitoRead
                Effect: Allow
                Action:
                  - "cognito-idp:ListUserPools"
                Resource: "*"

              - Sid: P5AccessAnalyzerRead
                Effect: Allow
                Action:
                  - "access-analyzer:ListAnalyzers"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # P6: Observability & Audit
              # ─────────────────────────────────────────────────────────────
              - Sid: P6CloudTrailRead
                Effect: Allow
                Action:
                  - "cloudtrail:DescribeTrails"
                  - "cloudtrail:LookupEvents"
                  - "cloudtrail:GetEventSelectors"
                Resource: "*"

              - Sid: P6CostAnomalyRead
                Effect: Allow
                Action:
                  - "ce:GetAnomalyMonitors"
                Resource: "*"

              - Sid: P6ConfigRead
                Effect: Allow
                Action:
                  - "config:DescribeConfigRules"
                Resource: "*"

              - Sid: P6CloudWatchRead
                Effect: Allow
                Action:
                  - "cloudwatch:DescribeAlarms"
                  - "logs:DescribeLogGroups"
                Resource: "*"

              - Sid: P6XRayRead
                Effect: Allow
                Action:
                  - "xray:GetGroups"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # P7: Real-Time Freshness & Zero-ETL
              # ─────────────────────────────────────────────────────────────
              - Sid: P7StreamingRead
                Effect: Allow
                Action:
                  - "kinesis:ListStreams"
                  - "kafka:ListClustersV2"
                  - "events:ListRules"
                  - "sns:ListTopics"
                  - "rds:DescribeIntegrations"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # P8: Agent Controllability & Policy
              # ─────────────────────────────────────────────────────────────
              - Sid: P8ComputeRead
                Effect: Allow
                Action:
                  - "lambda:ListFunctions"
                  - "appsync:ListGraphqlApis"
                Resource: "*"

              - Sid: P8ApiGatewayRead
                Effect: Allow
                Action:
                  - "apigateway:GET"
                Resource:
                  - "arn:aws:apigateway:*::/restapis"
                  - "arn:aws:apigateway:*::/restapis/*"

              - Sid: P8BedrockGuardrailsRead
                Effect: Allow
                Action:
                  - "bedrock:ListGuardrails"
                Resource: "*"

              - Sid: P8OrganizationsPolicyRead
                Effect: Allow
                Action:
                  # Only returns results from the organization management account
                  # or a delegated administrator account.
                  - "organizations:ListPolicies"
                Resource: "*"

              - Sid: P8OrchestrationRead
                Effect: Allow
                Action:
                  - "states:ListStateMachines"
                  - "sagemaker:ListNotebookInstances"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # P9: Decision Lineage & Explainability
              # ─────────────────────────────────────────────────────────────
              - Sid: P9AthenaRead
                Effect: Allow
                Action:
                  - "athena:ListWorkGroups"
                  - "athena:ListDataCatalogs"
                Resource: "*"

              - Sid: P9CostExplorerRead
                Effect: Allow
                Action:
                  - "ce:GetCostAndUsage"
                Resource: "*"

              - Sid: P9BedrockInvocationLoggingRead
                Effect: Allow
                Action:
                  - "bedrock:GetModelInvocationLoggingConfiguration"
                Resource: "*"

              # ─────────────────────────────────────────────────────────────
              # Shared: CloudFormation stack inspection (P1, P5)
              # ─────────────────────────────────────────────────────────────
              - Sid: SharedCloudFormationRead
                Effect: Allow
                Action:
                  - "cloudformation:ListStacks"
                Resource: "*"

Outputs:
  DafmAssessmentRoleArn:
    Description: ARN of the DAFM assessment role
    Value: !GetAtt DafmAssessmentRole.Arn
    Export:
      Name: DafmAssessmentRoleArn
