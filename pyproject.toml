[project]
name = "forge-assessment"
version = "2.3.0"
description = "FORGE 2.3 Assessment Workbench — AWS data estate readiness scoring for agentic AI"
requires-python = ">=3.9"
dependencies = [
    # Pinned to exact versions to reduce supply-chain risk (see docs/FORGE_Threat_Model.md, T6/WI-3).
    # Bump deliberately and re-test; do not use open ranges.
    "boto3==1.34.131",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
# PDF ingestion for Databricks document-first mode (see threat model T5/WI-2).
# Pinned so the parser library + version are explicit and auditable.
# pypdf 6.15.0 clears all known CVEs (pip-audit, 2026-08-31); do not downgrade.
pdf = [
    "pypdf==6.16.2",
]
test = [
    "pytest==9.0.3",
    "hypothesis==6.103.2",
]

[project.scripts]
forge = "forge.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
