# FORGE Partner Solution Catalog
# Partners register their products here, then reference them in recommendations.yaml.
#
# Each solution entry contains:
#   id: Unique slug used to reference this solution in recommendations.yaml
#   name: Product display name
#   vendor: Company name
#   category: Solution category
#   applicable_criteria: List of FORGE criteria IDs this product can address
#   description: Brief description of how the product helps (optional)
#   integration_notes: AWS integration specifics (optional)

solutions:
